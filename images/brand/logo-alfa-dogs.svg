  <path d="M86 52 C104 60, 126 60, 146 52 C166 44, 186 44, 206 52" stroke="#0a0a0a" stroke-width="1.5" fill="none" opacity="0.55"/>
  <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#0a0a0a" letter-spacing="4" opacity="0.7">BOORTMEERBEEK</text>
